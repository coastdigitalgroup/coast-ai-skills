<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Custom Media Player UI Spec Template</title>
  <style>
    /* ==========================================================================
       Media Player UI Tokens & System Architecture
       ========================================================================== */
    :root {
      --player-bg: #000000;
      --player-surface: #0F172A;
      --player-surface-hover: #1E293B;
      --player-overlay-gradient: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(15, 23, 42, 0.95) 100%);
      --player-text: #F8FAFC;
      --player-text-muted: #94A3B8;
      --player-brand: #3B82F6;
      --player-brand-hover: #2563EB;
      --player-focus-ring: #60A5FA;
      --player-track-bg: rgba(255, 255, 255, 0.25);
      --player-track-buffer: rgba(255, 255, 255, 0.5);
      --player-radius: 12px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: var(--player-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ==========================================================================
       Video Player Spatial Container
       ========================================================================== */
    .media-player-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background-color: var(--player-bg);
      border-radius: var(--player-radius);
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Native Video Element */
    .media-player-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Big Center Play Overlay Button */
    .big-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      z-index: 3;
    }

    .big-play-button:hover,
    .big-play-button:focus-visible {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: var(--player-brand);
      border-color: transparent;
      outline: 3px solid var(--player-focus-ring);
      outline-offset: 4px;
    }

    /* ==========================================================================
       Bottom Control Dock Overlay
       ========================================================================== */
    .media-controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 12px 20px;
      background: var(--player-overlay-gradient);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 4;
      transition: opacity 0.3s ease;
    }

    /* Row 1: Interactive Timeline Scrubber */
    .scrubber-container {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .scrubber-track {
      position: relative;
      width: 100%;
      height: 6px;
      background-color: var(--player-track-bg);
      border-radius: 3px;
      overflow: hidden;
      transition: height 0.15s ease;
    }

    .scrubber-container:hover .scrubber-track {
      height: 8px;
    }

    .scrubber-buffer {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 65%;
      background-color: var(--player-track-buffer);
    }

    .scrubber-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background-color: var(--player-brand);
    }

    .scrubber-range-input {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* Row 2: Control Toolbar Actions */
    .control-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Action Icon Buttons */
    .btn-icon {
      background: transparent;
      border: none;
      color: var(--player-text);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover {
      background-color: var(--player-surface-hover);
      color: #FFFFFF;
    }

    .btn-icon:focus-visible {
      outline: 2px solid var(--player-focus-ring);
      outline-offset: 2px;
      background-color: var(--player-surface-hover);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Time Display Counter */
    .time-display {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--player-text-muted);
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .time-display .time-current {
      color: var(--player-text);
      font-weight: 600;
    }

    /* Screen Reader Announcer */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Custom Accessible Media Player Component -->
  <div class="media-player-container" id="videoContainer" role="region" aria-label="Video lesson player">

    <!-- Native Video Element -->
    <video
      id="videoElement"
      class="media-player-video"
      poster="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80"
      preload="metadata">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      <track kind="captions" src="captions.vtt" srclang="en" label="English" default>
      Your browser does not support the HTML5 video tag.
    </video>

    <!-- Center Big Play Button Overlay -->
    <button type="button" class="big-play-button" id="bigPlayBtn" aria-label="Play video">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>
      </svg>
    </button>

    <!-- Bottom Control Dock Overlay -->
    <div class="media-controls-overlay" id="controlsOverlay">

      <!-- Row 1: Interactive Timeline Scrubber -->
      <div class="scrubber-container">
        <div class="scrubber-track">
          <div class="scrubber-buffer"></div>
          <div class="scrubber-progress" id="scrubberProgress"></div>
        </div>
        <input
          type="range"
          id="scrubberInput"
          class="scrubber-range-input"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Video timeline scrubber"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext="00:00 of 00:00">
      </div>

      <!-- Row 2: Control Toolbar Actions -->
      <div class="control-toolbar">

        <!-- Left Group: Playback, Jump, Volume & Time -->
        <div class="control-group">
          <button type="button" class="btn-icon" id="playPauseBtn" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>
            </svg>
          </button>

          <button type="button" class="btn-icon" id="muteBtn" aria-label="Mute audio">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="currentColor"></path>
            </svg>
          </button>

          <div class="time-display">
            <span class="time-current" id="currentTimeText">00:00</span> / <span id="durationText">00:00</span>
          </div>
        </div>

        <!-- Right Group: Captions, Speed, Fullscreen -->
        <div class="control-group">
          <button type="button" class="btn-icon" id="ccBtn" aria-label="Toggle closed captions" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z" fill="currentColor"></path>
            </svg>
          </button>

          <button type="button" class="btn-icon" id="fullscreenBtn" aria-label="Enter fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" fill="currentColor"></path>
            </svg>
          </button>
        </div>

      </div>

    </div>

    <!-- Screen Reader Live Status Announcer -->
    <div id="playerStatusAnnouncer" class="sr-only" aria-live="polite"></div>

  </div>

  <script>
    // Basic Interactive Script to bind Play/Pause and Keyboard Navigation
    const video = document.getElementById('videoElement');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const announcer = document.getElementById('playerStatusAnnouncer');

    function togglePlay() {
      if (video.paused) {
        video.play();
        bigPlayBtn.style.opacity = '0';
        bigPlayBtn.style.pointerEvents = 'none';
        playPauseBtn.setAttribute('aria-label', 'Pause');
        announcer.textContent = 'Video playing';
      } else {
        video.pause();
        bigPlayBtn.style.opacity = '1';
        bigPlayBtn.style.pointerEvents = 'auto';
        playPauseBtn.setAttribute('aria-label', 'Play');
        announcer.textContent = 'Video paused';
      }
    }

    bigPlayBtn.addEventListener('click', togglePlay);
    playPauseBtn.addEventListener('click', togglePlay);

    // Keyboard Shortcuts (Space/K for toggle)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === 'k') {
        if (document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          togglePlay();
        }
      }
    });
  </script>
</body>
</html>
