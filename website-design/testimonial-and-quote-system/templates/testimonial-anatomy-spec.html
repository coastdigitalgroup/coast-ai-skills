<!--
  TESTIMONIAL ANATOMY SPECIFICATION

  This template provides highly semantic, accessible, and responsive layouts
  for customer testimonials. It uses vanilla HTML and CSS Custom Properties
  for maximum portability across UI frameworks (React, Vue, Svelte, Web Components).

  Accessibility Compliance:
  - WCAG 2.2 AA Contrast Standards: Foreground text meets >= 4.5:1 ratio.
  - Semantic markup: Wraps testimonials in <figure> and blockquote.
  - Decorative icons and quotes are hidden from screen readers via aria-hidden="true".
-->

<style>
  /* Base Spatial Design Tokens */
  :root {
    --color-text-primary: #0f172a;   /* Slate 900 */
    --color-text-secondary: #334155; /* Slate 700 */
    --color-text-muted: #64748b;     /* Slate 500 */
    --color-border-subtle: #e2e8f0;  /* Slate 200 */
    --color-brand-primary: #0f62fe;  /* Brand Accent */
    --color-bg-card: #ffffff;
    --color-bg-badge: #e0f2fe;       /* Sky 100 */
    --color-text-badge: #0369a1;     /* Sky 700 */

    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;

    --space-s: 8px;
    --space-m: 16px;
    --space-l: 24px;
    --space-xl: 32px;
    --space-xxl: 48px;

    --radius-m: 8px;
    --radius-l: 12px;
    --radius-full: 9999px;
  }

  /* Global Reset & Utility Styles */
  .testimonial-font-sans {
    font-family: var(--font-sans);
  }

  /* =========================================================================
     PATTERN 1: SPOTLIGHT TESTIMONIAL (CENTERED & HIGH-IMPACT)
     ========================================================================= */
  .testimonial-spotlight {
    position: relative;
    max-width: 800px;
    margin: 0 auto;
    padding: var(--space-xxl) var(--space-xl);
    text-align: center;
    background-color: transparent;
  }

  /* Large decorative quote marks positioned absolutely to avoid content overlapping */
  .testimonial-spotlight::before {
    content: "“";
    position: absolute;
    top: var(--space-m);
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-serif);
    font-size: 120px;
    line-height: 1;
    color: var(--color-border-subtle);
    opacity: 0.5;
    z-index: -1;
    pointer-events: none;
  }

  .testimonial-spotlight blockquote {
    margin: 0 0 var(--space-xl) 0;
    padding: 0;
  }

  .testimonial-spotlight .quote-text {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--color-text-primary);
  }

  .testimonial-spotlight figcaption {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-m);
  }

  .testimonial-spotlight .avatar {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-full);
    object-fit: cover;
    border: 2px solid var(--color-border-subtle);
  }

  .testimonial-spotlight .author-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .testimonial-spotlight .author-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text-primary);
  }

  .testimonial-spotlight .author-meta {
    font-size: 14px;
    color: var(--color-text-muted);
  }

  /* Trust & Source Verification Badge */
  .testimonial-spotlight .trust-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background-color: var(--color-bg-badge);
    color: var(--color-text-badge);
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Responsive Design Rules for Spotlight */
  @media (max-width: 768px) {
    .testimonial-spotlight {
      padding: var(--space-xl) var(--space-m);
    }
    .testimonial-spotlight .quote-text {
      font-size: 20px;
    }
    .testimonial-spotlight::before {
      font-size: 90px;
      top: 0;
    }
  }

  /* =========================================================================
     PATTERN 2: TESTIMONIAL CARD (GRID PLACEMENT)
     ========================================================================= */
  .testimonial-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: var(--space-l);
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-xl) var(--space-m);
  }

  .testimonial-card {
    background-color: var(--color-bg-card);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-l);
    padding: var(--space-xl);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .testimonial-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
  }

  .testimonial-card blockquote {
    margin: 0 0 var(--space-l) 0;
    padding: 0;
  }

  .testimonial-card .quote-text {
    font-size: 15px;
    line-height: 1.5;
    color: var(--color-text-secondary);
  }

  .testimonial-card figcaption {
    display: flex;
    align-items: center;
    gap: var(--space-m);
    border-top: 1px solid var(--color-border-subtle);
    padding-top: var(--space-m);
  }

  .testimonial-card .avatar {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-full);
    object-fit: cover;
  }

  .testimonial-card .author-info {
    display: flex;
    flex-direction: column;
  }

  .testimonial-card .author-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
  }

  .testimonial-card .author-meta {
    font-size: 12px;
    color: var(--color-text-muted);
  }
</style>

<!-- =========================================================================
     REUSABLE TEMPLATE BLOCK 1: SPOTLIGHT HERO TESTIMONIAL
     ========================================================================= -->
<figure class="testimonial-spotlight testimonial-font-sans">
  <blockquote>
    <!-- Decorative quotation marks are hidden from screen readers.
         Direct semantic quote text is announced clearly. -->

    </p>

    <span class="trust-badge">

</figure>
