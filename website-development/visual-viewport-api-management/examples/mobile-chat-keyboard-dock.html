<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Mobile Chat & Floating Action Bar - Visual Viewport Optimization</title>
  <style>
    :root {
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-primary: #2563eb;
      --color-text: #0f172a;
      --color-border: #e2e8f0;

      /* Visual Viewport State Defaults */
      --vv-height: 100vh;
      --vv-top: 0px;
      --vv-scale: 1;
      --keyboard-offset: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .app-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 16px;
      text-align: center;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* Main Messages Feed */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .chat-bubble.incoming {
      align-self: flex-start;
      background: #e2e8f0;
      color: var(--color-text);
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.outgoing {
      align-self: flex-end;
      background: var(--color-primary);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    /* -------------------------------------------------------------------------
       BEFORE IMPLEMENTATION (Naïve position: fixed bottom)
       On iOS Safari, .chat-input-bar (naive) stays pinned to layout bottom
       underneath the virtual keyboard, obscuring the input field.
       ------------------------------------------------------------------------- */
    /*
    .chat-input-bar-naive {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 12px 16px;
    }
    */

    /* -------------------------------------------------------------------------
       AFTER IMPLEMENTATION (Visual Viewport Aware Docked Input Bar)
       Translates vertically based on calculated soft-keyboard height
       ------------------------------------------------------------------------- */
    .chat-input-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      gap: 8px;
      align-items: center;

      /* Dynamic position transform mapped to soft-keyboard offset */
      transform: translateY(calc(-1 * var(--keyboard-offset, 0px)));
      transition: transform 120ms cubic-bezier(0, 0, 0.2, 1);
      will-change: transform;
      z-index: 100;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 20px;
      font-size: 16px; /* Prevents auto-zoom on iOS Safari */
      outline: none;
    }

    .chat-input-bar input:focus {
      border-color: var(--color-primary);
    }

    .chat-input-bar button {
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Status Banner for Debugging */
    .debug-status {
      font-size: 0.75rem;
      color: #64748b;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    Support Chat Assistant
  </header>

  <main class="chat-feed" id="chatFeed">
    <div class="debug-status" id="debugStatus">
      Visual Viewport: Inactive / Standard Mode
    </div>

    <div class="chat-bubble incoming">
      Hello! How can we assist you with your order today?
    </div>
    <div class="chat-bubble outgoing">
      I have a question about my delivery status.
    </div>
    <div class="chat-bubble incoming">
      Sure! Please type your order ID or tracking code below.
    </div>
  </main>

  <form class="chat-input-bar" id="chatForm">
    <input
      type="text"
      id="chatInput"
      placeholder="Type a message..."
      autocomplete="off"
      aria-label="Message"
    />
    <button type="submit">Send</button>
  </form>

  <script>
    /**
     * Visual Viewport API Controller Script
     * Computes virtual keyboard offset and updates CSS custom properties
     */
    class VisualViewportManager {
      constructor() {
        this.debugStatus = document.getElementById('debugStatus');
        this.chatFeed = document.getElementById('chatFeed');
        this.chatInput = document.getElementById('chatInput');
        this.rafId = null;

        this.init();
      }

      init() {
        if (!('visualViewport' in window)) {
          if (this.debugStatus) {
            this.debugStatus.textContent = 'visualViewport API not supported in this browser.';
          }
          return;
        }

        const vv = window.visualViewport;

        const handleViewportChange = () => {
          if (this.rafId) cancelAnimationFrame(this.rafId);

          this.rafId = requestAnimationFrame(() => {
            const windowHeight = window.innerHeight;
            const visualHeight = vv.height;
            const visualTop = vv.offsetTop;
            const scale = vv.scale;

            // Calculate virtual keyboard height accounting for iOS layout offset
            const keyboardOffset = Math.max(0, windowHeight - visualHeight - visualTop);

            // Set CSS Custom Properties
            document.documentElement.style.setProperty('--vv-height', `${visualHeight}px`);
            document.documentElement.style.setProperty('--vv-top', `${visualTop}px`);
            document.documentElement.style.setProperty('--vv-scale', `${scale}`);
            document.documentElement.style.setProperty('--keyboard-offset', `${keyboardOffset}px`);

            // Debug UI output
            if (this.debugStatus) {
              this.debugStatus.textContent = `Keyboard Offset: ${Math.round(keyboardOffset)}px | VV Height: ${Math.round(visualHeight)}px | Scale: ${scale.toFixed(2)}`;
            }

            // Scroll active conversation feed to bottom when keyboard opens
            if (keyboardOffset > 0 && document.activeElement === this.chatInput) {
              this.chatFeed.scrollTop = this.chatFeed.scrollHeight;
            }
          });
        };

        vv.addEventListener('resize', handleViewportChange);
        vv.addEventListener('scroll', handleViewportChange);
        window.addEventListener('orientationchange', handleViewportChange);

        // Initial setup run
        handleViewportChange();
      }
    }

    // Initialize Viewport Manager
    const viewportManager = new VisualViewportManager();

    // Prevent default form submit action for demo
    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;

      const feed = document.getElementById('chatFeed');
      const msg = document.createElement('div');
      msg.className = 'chat-bubble outgoing';
      msg.textContent = val;
      feed.appendChild(msg);
      input.value = '';
      feed.scrollTop = feed.scrollHeight;
    });
  </script>
</body>
</html>
