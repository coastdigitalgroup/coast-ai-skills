<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MutationObserver Implementation Example</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #f43f5e;
      --success: #22c55e;
      --warning: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    p.subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button {
      background-color: var(--card-border);
      color: var(--text-main);
      border: none;
      padding: 0.5rem 0.85rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #475569;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    button.primary:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    button.danger {
      background-color: var(--danger);
      color: #ffffff;
    }

    .dynamic-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 180px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px dashed var(--card-border);
      padding: 0.75rem;
      border-radius: 0.5rem;
    }

    .widget-card {
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .widget-card[data-initialized="true"] {
      border-left: 4px solid var(--success);
    }

    .widget-card[data-state="active"] {
      background-color: #1e3a8a;
    }

    .widget-card[data-state="disabled"] {
      opacity: 0.5;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      background-color: var(--card-border);
      color: var(--text-muted);
    }

    .badge.active {
      background-color: var(--success);
      color: #042f2e;
    }

    .log-panel {
      background-color: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #a5f3fc;
      height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .log-entry {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.25rem;
      line-height: 1.4;
    }

    .log-entry .time {
      color: var(--text-muted);
      margin-right: 0.5rem;
    }

    .log-entry .tag {
      font-weight: 600;
      padding: 0.05rem 0.3rem;
      border-radius: 0.2rem;
      margin-right: 0.4rem;
    }

    .tag.added { background-color: #14532d; color: #86efac; }
    .tag.removed { background-color: #7f1d1d; color: #fca5a5; }
    .tag.attr { background-color: #713f12; color: #fef08a; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>MutationObserver Implementation Example</h1>
  <p class="subtitle">Demonstrating safe childList observation, attribute filtering, recursion protection, and lifecycle teardown.</p>

  <div class="grid-layout">
    <!-- Interactive Target Panel -->
    <div class="panel">
      <div class="panel-title">
        <span>Dynamic Widget Container</span>
        <span id="widget-count" class="badge">0 Widgets</span>
      </div>

      <div class="btn-group">
        <button id="btn-add" class="primary">+ Add Widget (childList)</button>
        <button id="btn-toggle-attr">Toggle State Attr (attributes)</button>
        <button id="btn-clear" class="danger">Clear List</button>
        <button id="btn-toggle-obs">Pause Observer</button>
      </div>

      <div id="widget-container" class="dynamic-list">
        <!-- Dynamically injected widgets go here -->
      </div>
    </div>

    <!-- Mutation Audit Log Panel -->
    <div class="panel">
      <div class="panel-title">
        <span>Mutation Log (Microtask Batched)</span>
        <button id="btn-clear-log">Clear Log</button>
      </div>

      <div id="log-output" class="log-panel">
        <div class="log-entry"><span class="time">[00:00:00]</span> Initialized MutationObserver.</div>
      </div>
    </div>
  </div>

  <script type="module">
    // Import managed observer pattern logic
    class ManagedMutationObserver {
      constructor(target, callback, options = {}) {
        this.target = target;
        this.callback = callback;
        this.options = options;
        this.isProcessing = false;
        this.observer = null;
        this.isPaused = false;

        this.init();
      }

      init() {
        this.observer = new MutationObserver((mutationsList, obs) => {
          // Recursion Guard: Prevent re-entrant mutation loops
          if (this.isProcessing) return;

          try {
            this.isProcessing = true;
            this.callback(mutationsList, obs);
          } finally {
            this.isProcessing = false;
          }
        });

        this.start();
      }

      start() {
        if (!this.target) return;
        this.observer.observe(this.target, this.options);
        this.isPaused = false;
      }

      pause() {
        if (this.observer) {
          // Deliver any pending mutations before pausing
          const pending = this.observer.takeRecords();
          if (pending.length > 0) {
            this.callback(pending, this.observer);
          }
          this.observer.disconnect();
          this.isPaused = true;
        }
      }

      disconnect() {
        if (this.observer) {
          this.observer.disconnect();
          this.observer = null;
        }
      }
    }

    // DOM References
    const widgetContainer = document.getElementById('widget-container');
    const widgetCountBadge = document.getElementById('widget-count');
    const logOutput = document.getElementById('log-output');

    const btnAdd = document.getElementById('btn-add');
    const btnToggleAttr = document.getElementById('btn-toggle-attr');
    const btnClear = document.getElementById('btn-clear');
    const btnToggleObs = document.getElementById('btn-toggle-obs');
    const btnClearLog = document.getElementById('btn-clear-log');

    let widgetCounter = 0;

    function logEvent(tagType, tagClass, text) {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="time">[${timeStr}]</span><span class="tag ${tagClass}">${tagType}</span>${text}`;

      logOutput.appendChild(entry);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    // Initialize Managed MutationObserver
    // Filters: childList changes and specifically 'data-state' attribute mutations
    const managedObs = new ManagedMutationObserver(
      widgetContainer,
      (mutationsList) => {
        for (const mutation of mutationsList) {
          if (mutation.type === 'childList') {
            // Process added nodes
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === Node.ELEMENT_NODE && node.matches('.widget-card')) {
                // Auto-initialize component on dynamic insertion
                node.setAttribute('data-initialized', 'true');

                // Attach internal event listener
                const closeBtn = node.querySelector('.btn-close-card');
                if (closeBtn) {
                  closeBtn.addEventListener('click', () => node.remove());
                }

                logEvent('ADDED', 'added', `Injected widget #${node.dataset.id} into container.`);
              }
            });

            // Process removed nodes
            mutation.removedNodes.forEach((node) => {
              if (node.nodeType === Node.ELEMENT_NODE && node.matches('.widget-card')) {
                logEvent('REMOVED', 'removed', `Removed widget #${node.dataset.id} from container.`);
              }
            });

            // Update widget count in UI
            const count = widgetContainer.querySelectorAll('.widget-card').length;
            widgetCountBadge.textContent = `${count} Widget${count === 1 ? '' : 's'}`;
          }

          if (mutation.type === 'attributes') {
            const target = mutation.target;
            const newVal = target.getAttribute(mutation.attributeName);
            logEvent('ATTR', 'attr', `Widget #${target.dataset.id} ${mutation.attributeName} changed to "${newVal}"`);
          }
        }
      },
      {
        childList: true,
        subtree: true, // Needed to capture attribute changes on child widgets
        attributes: true,
        attributeFilter: ['data-state'] // Strict filtering to avoid firing on style or class changes
      }
    );

    // Interactive Button Handlers
    btnAdd.addEventListener('click', () => {
      widgetCounter++;
      const card = document.createElement('div');
      card.className = 'widget-card';
      card.dataset.id = String(widgetCounter);
      card.dataset.state = 'active';

      card.innerHTML = `
        <div>
          <strong>Widget #${widgetCounter}</strong>
          <span class="badge active" style="margin-left:0.5rem">active</span>
        </div>
        <button class="btn-close-card danger" style="padding:0.2rem 0.5rem; font-size:0.75rem">Remove</button>
      `;

      widgetContainer.appendChild(card);
    });

    btnToggleAttr.addEventListener('click', () => {
      const cards = widgetContainer.querySelectorAll('.widget-card');
      if (cards.length === 0) {
        logEvent('WARN', 'attr', 'No widgets available to toggle attributes.');
        return;
      }

      cards.forEach((card) => {
        const currentState = card.dataset.state;
        const newState = currentState === 'active' ? 'disabled' : 'active';
        card.dataset.state = newState;

        const badge = card.querySelector('.badge');
        if (badge) {
          badge.textContent = newState;
          badge.className = `badge ${newState === 'active' ? 'active' : ''}`;
        }
      });
    });

    btnClear.addEventListener('click', () => {
      widgetContainer.innerHTML = '';
    });

    btnToggleObs.addEventListener('click', () => {
      if (managedObs.isPaused) {
        managedObs.start();
        btnToggleObs.textContent = 'Pause Observer';
        btnToggleObs.classList.remove('primary');
        logEvent('SYS', 'added', 'Resumed MutationObserver.');
      } else {
        managedObs.pause();
        btnToggleObs.textContent = 'Resume Observer';
        btnToggleObs.classList.add('primary');
        logEvent('SYS', 'removed', 'Paused MutationObserver.');
      }
    });

    btnClearLog.addEventListener('click', () => {
      logOutput.innerHTML = '';
    });
  </script>
</body>
</html>
