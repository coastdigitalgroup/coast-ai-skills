<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MutationObserver Dynamic DOM & Attribute Example</title>
  <style>
    :root {
      --font-family: system-ui, -apple-system, sans-serif;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 900px;
      margin-inline: auto;
    }

    h1, h2 {
      margin: 0;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent-color);
      color: #0284c7;
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .feed-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      padding: 0.75rem;
    }

    .feed-item {
      background: #090d16;
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      border-radius: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feed-item[data-enhanced="true"] {
      border-left: 4px solid var(--success-color);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      text-transform: uppercase;
    }

    .status-badge[data-state="active"] {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--success-color);
    }

    .status-badge[data-state="pending"] {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--warning-color);
    }

    .log-box {
      background-color: #020617;
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      max-height: 200px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 0.35rem;
    }

    .log-entry span.type {
      color: var(--accent-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>MutationObserver Live Demonstration</h1>
  <p>Demonstrates recursion-safe child list insertion observation and attribute state synchronization.</p>

  <div class="container">
    <h2>Dynamic Feed Container</h2>
    <div class="button-group">
      <button id="add-item-btn">Simulate External Item Injection</button>
      <button id="toggle-state-btn">Toggle Status Attributes</button>
      <button id="clear-feed-btn">Clear Items</button>
    </div>

    <ul id="dynamic-feed" class="feed-list" aria-live="polite">
      <li class="feed-item" data-state="pending">
        <span>Initial System Entry #1</span>
        <span class="status-badge" data-state="pending">Pending</span>
      </li>
    </ul>
  </div>

  <div class="container">
    <h2>Mutation Event Log</h2>
    <div id="log-box" class="log-box"></div>
  </div>

  <script type="module">
    // Helper to append log entries
    const logBox = document.getElementById('log-box');
    function logEvent(type, message) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="type">[${type}]</span> ${message}`;
      logBox.prepend(entry);
    }

    const feedList = document.getElementById('dynamic-feed');

    // Safe MutationObserver with Recursion Guard
    let isProcessingMutation = false;

    const observer = new MutationObserver((mutationsList) => {
      if (isProcessingMutation) return; // Prevent infinite recursion loop

      isProcessingMutation = true;

      try {
        for (const mutation of mutationsList) {
          if (mutation.type === 'childList') {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === Node.ELEMENT_NODE) {
                logEvent('CHILD_LIST', `New element inserted: &lt;${node.tagName.toLowerCase()}&gt;`);

                // Enhance newly inserted node (safe write due to recursion guard)
                if (!node.hasAttribute('data-enhanced')) {
                  node.setAttribute('data-enhanced', 'true');
                  const timestamp = document.createElement('small');
                  timestamp.style.color = '#94a3b8';
                  timestamp.textContent = ` (Enhanced at ${new Date().toLocaleTimeString()})`;
                  node.querySelector('span')?.appendChild(timestamp);
                }
              }
            });

            mutation.removedNodes.forEach((node) => {
              if (node.nodeType === Node.ELEMENT_NODE) {
                logEvent('CHILD_LIST', `Element removed from DOM`);
              }
            });
          } else if (mutation.type === 'attributes') {
            const { target, attributeName, oldValue } = mutation;
            const newValue = target.getAttribute(attributeName);
            logEvent('ATTRIBUTES', `Attribute <strong>${attributeName}</strong> changed on &lt;${target.tagName.toLowerCase()}&gt; from "${oldValue}" to "${newValue}"`);
          }
        }
      } finally {
        // Flush mutations generated by internal script enhancements before unlocking
        observer.takeRecords();
        isProcessingMutation = false;
      }
    });

    // Start observing target node with specific options
    observer.observe(feedList, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['data-state', 'class'],
      attributeOldValue: true
    });

    // Interactive Control Triggers
    let itemCount = 1;
    document.getElementById('add-item-btn').addEventListener('click', () => {
      itemCount++;
      const newItem = document.createElement('li');
      newItem.className = 'feed-item';
      newItem.setAttribute('data-state', 'pending');
      newItem.innerHTML = `
        <span>Dynamic Injected Entry #${itemCount}</span>
        <span class="status-badge" data-state="pending">Pending</span>
      `;
      feedList.appendChild(newItem);
      feedList.scrollTop = feedList.scrollHeight;
    });

    document.getElementById('toggle-state-btn').addEventListener('click', () => {
      const items = feedList.querySelectorAll('.feed-item');
      items.forEach((item) => {
        const currentState = item.getAttribute('data-state');
        const newState = currentState === 'pending' ? 'active' : 'pending';
        item.setAttribute('data-state', newState);

        const badge = item.querySelector('.status-badge');
        if (badge) {
          badge.setAttribute('data-state', newState);
          badge.textContent = newState.toUpperCase();
        }
      });
    });

    document.getElementById('clear-feed-btn').addEventListener('click', () => {
      feedList.innerHTML = '';
    });
  </script>
</body>
</html>
