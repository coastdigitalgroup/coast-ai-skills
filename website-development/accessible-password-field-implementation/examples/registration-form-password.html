<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Registration Form with Password Controls</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #cbd5e1;
      --color-border-focus: #2563eb;

      --color-strength-0: #e2e8f0;
      --color-strength-1: #ef4444; /* Weak */
      --color-strength-2: #f97316; /* Fair */
      --color-strength-3: #eab308; /* Good */
      --color-strength-4: #22c55e; /* Strong */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .form-card {
      background: var(--color-surface);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .input-control {
      width: 100%;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      box-sizing: border-box;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .input-control:focus-visible {
      outline: none;
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* Password Input Wrapper for Toggle Alignments */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper .input-control {
      padding-right: 3.25rem; /* Space for eye button */
    }

    .password-toggle {
      position: absolute;
      right: 0.375rem;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0.625rem;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--color-text-muted);
      transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
    }

    .password-toggle:hover {
      background-color: #f1f5f9;
      color: var(--color-text);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: -2px;
    }

    .password-toggle svg {
      width: 1.5rem;
      height: 1.5rem;
    }

    /* Password Strength Meter */
    .strength-meter-container {
      margin-top: 0.75rem;
    }

    .strength-bar-track {
      height: 6px;
      background-color: var(--color-strength-0);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      gap: 3px;
      margin-bottom: 0.375rem;
    }

    .strength-segment {
      flex: 1;
      height: 100%;
      background-color: var(--color-strength-0);
      transition: background-color 0.2s ease-in-out;
    }

    /* Map segments to scored coloring */
    .strength-meter-container[data-score="1"] .strength-segment:nth-child(1) { background-color: var(--color-strength-1); }
    .strength-meter-container[data-score="2"] .strength-segment:nth-child(-n+2) { background-color: var(--color-strength-2); }
    .strength-meter-container[data-score="3"] .strength-segment:nth-child(-n+3) { background-color: var(--color-strength-3); }
    .strength-meter-container[data-score="4"] .strength-segment:nth-child(-n+4) { background-color: var(--color-strength-4); }

    .strength-label {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      display: block;
      font-weight: 500;
    }

    .strength-text {
      font-weight: 700;
    }

    /* Constraints Checklist */
    .constraints-list {
      margin: 1rem 0 0 0;
      padding: 0;
      list-style-type: none;
    }

    .constraint-item {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.375rem;
      transition: color 0.15s ease-in-out;
    }

    .constraint-item .indicator {
      display: inline-flex;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid var(--color-border);
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transition: border-color 0.15s ease-in-out, background-color 0.15s ease-in-out;
    }

    /* Active and Checkmarked States */
    .constraint-item.valid {
      color: #16a34a;
    }

    .constraint-item.valid .indicator {
      border-color: #16a34a;
      background-color: #16a34a;
      position: relative;
    }

    .constraint-item.valid .indicator::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 6px;
      border: solid white;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg) translate(-0.5px, -1px);
    }

    /* SR Only elements */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background-color: var(--color-primary);
      color: #ffffff;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      background-color: var(--color-primary-hover);
    }

    .submit-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* Windows Forced Colors / High Contrast Mode */
    @media (forced-colors: active) {
      .password-toggle {
        border: 1px solid ButtonText;
      }
      .constraint-item.valid .indicator {
        border-color: ButtonText;
        background-color: ButtonText;
      }
      .strength-segment {
        border: 1px solid CanvasText;
      }
      .strength-meter-container[data-score="1"] .strength-segment:nth-child(1),
      .strength-meter-container[data-score="2"] .strength-segment:nth-child(-n+2),
      .strength-meter-container[data-score="3"] .strength-segment:nth-child(-n+3),
      .strength-meter-container[data-score="4"] .strength-segment:nth-child(-n+4) {
        background-color: Highlight;
      }
    }
  </style>
</head>
<body>

  <main class="form-card">
    <h1>Create Your Account</h1>

    <form id="signup-form" action="#" method="POST" novalidate>

      <!-- Username / Email Field for proper autofill link -->
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email"
               id="reg-email"
               name="email"
               class="input-control"
               autocomplete="username"
               required>
      </div>

      <!-- Accessible Password Field Group -->
      <div class="form-group">
        <label id="password-label" for="reg-password">Password</label>

        <div class="password-wrapper">
          <input type="password"
                 id="reg-password"
                 name="password"
                 class="input-control"
                 autocomplete="new-password"
                 required
                 aria-describedby="password-strength-announcer password-constraints"
                 aria-invalid="false">

          <button type="button"
                  id="password-toggle-btn"
                  class="password-toggle"
                  aria-label="Show password"
                  aria-pressed="false"
                  tabindex="0">
            <!-- Dynamic Eye / Crossed-Eye SVG -->
            <svg id="eye-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <!-- Default: Eye Open -->
              <path class="eye-open" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path class="eye-open" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              <!-- Crossed slash, visible only when password is shown -->
              <path class="eye-closed" stroke-dasharray="0" stroke-dashoffset="0" style="display: none;" d="M3 3l18 18" />
            </svg>
          </button>
        </div>

        <!-- Hidden Polite Screen Reader announcer for password strength -->
        <div id="password-strength-announcer" class="sr-only" aria-live="polite"></div>

        <!-- Visual Password Strength Meter -->
        <div id="password-strength-meter" class="strength-meter-container" data-score="0">
          <div class="strength-bar-track" aria-hidden="true">
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
          </div>
          <span class="strength-label" aria-hidden="true">
            Password strength: <span id="strength-text-element">Empty</span>
          </span>
        </div>

        <!-- Password Constraints Checklist -->
        <ul id="password-constraints" class="constraints-list" aria-label="Password requirements">
          <li id="constraint-length" class="constraint-item" aria-live="polite">
            <span class="indicator" aria-hidden="true"></span>
            <span>At least 8 characters</span>
          </li>
          <li id="constraint-number" class="constraint-item" aria-live="polite">
            <span class="indicator" aria-hidden="true"></span>
            <span>At least 1 number</span>
          </li>
          <li id="constraint-symbol" class="constraint-item" aria-live="polite">
            <span class="indicator" aria-hidden="true"></span>
            <span>At least 1 special character</span>
          </li>
        </ul>

      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>
  </main>

  <script>
    class PasswordController {
      constructor() {
        this.form = document.getElementById('signup-form');
        this.input = document.getElementById('reg-password');
        this.toggleBtn = document.getElementById('password-toggle-btn');
        this.eyeIcon = document.getElementById('eye-icon');
        this.strengthMeter = document.getElementById('password-strength-meter');
        this.strengthText = document.getElementById('strength-text-element');
        this.srAnnouncer = document.getElementById('password-strength-announcer');

        // Checklist items
        this.rules = {
          length: { element: document.getElementById('constraint-length'), check: val => val.length >= 8, announced: false },
          number: { element: document.getElementById('constraint-number'), check: val => /\d/.test(val), announced: false },
          symbol: { element: document.getElementById('constraint-symbol'), check: val => /[^A-Za-z0-9]/.test(val), announced: false }
        };

        this.lastScoreName = 'Empty';
        this.strengthLabels = ['Empty', 'Weak', 'Fair', 'Good', 'Strong'];

        this.init();
      }

      init() {
        this.toggleBtn.addEventListener('click', () => this.toggleVisibility());
        this.input.addEventListener('input', () => this.handleInput());
        this.form.addEventListener('submit', (e) => this.handleSubmit(e));
      }

      toggleVisibility() {
        const isShowing = this.input.type === 'text';

        // 1. Capture exact caret and selection positions
        const start = this.input.selectionStart;
        const end = this.input.selectionEnd;

        // 2. Toggle type
        this.input.type = isShowing ? 'password' : 'text';

        // 3. Update accessibility attributes
        this.toggleBtn.setAttribute('aria-label', isShowing ? 'Show password' : 'Hide password');
        this.toggleBtn.setAttribute('aria-pressed', String(!isShowing));

        // 4. Update Eye SVG lines dynamically
        const closedPath = this.eyeIcon.querySelector('.eye-closed');
        closedPath.style.display = isShowing ? 'none' : 'block';

        // 5. Restore caret focus positions seamlessly
        if (document.activeElement === this.input || document.activeElement === this.toggleBtn) {
          this.input.focus();
          this.input.setSelectionRange(start, end);
        }
      }

      handleInput() {
        const value = this.input.value;
        let score = 0;

        // Update requirements checklists and status states
        for (const [key, rule] of Object.entries(this.rules)) {
          const isValid = rule.check(value);
          if (isValid) {
            rule.element.classList.add('valid');
            score++;

            // Screen reader announcements upon change state
            if (!rule.announced) {
              this.announceToScreenReader(`${rule.element.textContent.trim()} requirement met.`);
              rule.announced = true;
            }
          } else {
            rule.element.classList.remove('valid');
            if (rule.announced) {
              this.announceToScreenReader(`${rule.element.textContent.trim()} requirement no longer met.`);
              rule.announced = false;
            }
          }
        }

        // Strength calculation scores
        if (value.length > 0 && score === 0) {
          score = 1; // At least weak if user has entered anything
        }

        this.strengthMeter.setAttribute('data-score', String(score));
        const scoreName = this.strengthLabels[score];
        this.strengthText.textContent = scoreName;

        // Screen reader announcement on strength changes
        if (scoreName !== this.lastScoreName) {
          this.announceToScreenReader(`Password strength: ${scoreName}`);
          this.lastScoreName = scoreName;
        }
      }

      announceToScreenReader(message) {
        // Clear text first then trigger update to ensure announcement is spoken by screen readers
        this.srAnnouncer.textContent = '';
        setTimeout(() => {
          this.srAnnouncer.textContent = message;
        }, 50);
      }

      handleSubmit(e) {
        const allValid = Object.values(this.rules).every(rule => rule.check(this.input.value));

        if (!allValid) {
          e.preventDefault();
          this.input.setAttribute('aria-invalid', 'true');
          this.announceToScreenReader('Cannot register. Password requirements are not fully satisfied.');
          this.input.focus();
        } else {
          this.input.setAttribute('aria-invalid', 'false');
          alert('Registration payload submitted successfully (Demo)!');
        }
      }
    }

    // Instantiation
    document.addEventListener('DOMContentLoaded', () => {
      new PasswordController();
    });
  </script>
</body>
</html>
